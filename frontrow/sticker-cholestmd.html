<!-- MOCKUP: FrontrowMD "sticker" widget markup captured from 1md.org/products/livermd (Oct 28 2026), recolored and re-worded for the SR phone test. The real widget is served by FrontrowMD. -->
<html><head>
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
      /* GENERAL STYLES */
      html, body { height: fit-content; overflow: hidden;}

      body[data-state="min"], body[data-state="max"] {
        margin: 0;
      }

      body[data-state="max"] #maximized {
        display: flex;
        gap: 12px;
        justify-content: flex-start;
        overflow: hidden;

        width: 437px;
      }

      body[data-state="max"] #minimized {
        display: none;
      }

      body * {
        font-family: 'Open sans', serif;
      }

      .test-mode-floating-badge {
        position: absolute;
        padding: 4px 10px;
        background: #10B981;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        color: white;
        letter-spacing: 0.5px;
        z-index: 10;
        white-space: nowrap;
      }

      p {
        margin: 0;
        font-size: 13px;
        font-style: normal;
        font-weight: 400;
        line-height: 18px;
      }

      button {
        padding: 0;
        border: none;
        background-color: transparent;
        cursor: pointer;
      }

      img {
        position: relative;
      }

      .bold { display: inline; font-weight: 600; }
      .italics { display: inline; font-style: italic; }

      /* HEADER */
      .heading {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4px;
      }

      .heading > p {
        text-align: center;
        font-family: 'Lora', serif;
        font-size: 18px;
        font-style: normal;
        font-weight: 500;
        line-height: 21px;
        letter-spacing: 0.2px;
      }

        .heading > p {
          font-size: 16px;
        }

      .heading > span > svg, .heading > span {
        height: 40px;
        width: auto;
      }

      /* MAIN SECTION */
      #maximized {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        opacity: 1;
        visibility: visible;
        transition: opacity .3s ease-out, visibility .3s ease-out, width .3s ease-in-out;
        padding-right: 10px;
      }

      #maximized * {
        transition: opacity .3s ease-out;
      }

      body[data-state="min"] #maximized,
      body[data-state="min"] #maximized * {
        opacity: 0;
        visibility: hidden;
      }

      body[data-state="max"] #maximized,
      body[data-state="max"] #maximized * {
        opacity: 1;
        visibility: visible;
      }

      .background {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;

        width: 387px;
        padding: 8px 0px 10px 8px;
        gap: 10px;

        z-index: 1;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* CTAs */
      .cta {
        display: flex;
        flex-direction: row;
        gap: 6px;
        align-items: center;
      }

      .images {
        height: 18px;
      }

      .learn-more {
        text-decoration-line: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
      }

      .testimonial-cta {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .testimonial-cta > p {
        font-weight: 600;
      }

      .testimonial-cta > p:hover {
        text-decoration-line: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
      }

      /* RIBBON TAILS */
      .ribbon-tails {
        height: 78px;
        z-index: -1;
      }

      .ribbon-tails svg {
        position: absolute;
        right: 0;
        width: 35px;
        height: 55px;
      }

      .ribbon-tails svg:first-of-type {
        top: 0;
      }

      .ribbon-tails svg:last-of-type {
        bottom: 0;
      }

      .ribbon-body {
        position: absolute;
        left: 0;
        top: 0;
        width: calc(100% - 32px);
        height: 100%;
      }

      /* CLOSE BUTTON */
      .close-button {
        display: flex;
        padding: 6px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 3;

        justify-self: flex-start;
        align-self: flex-start;
        margin-top: 5px;

        border-radius: 68px;
        background: #E0E0E0;
      }

      /* MINIMIZED */
      .minimized {
        height: 78px;
        width: 40px;
        position: absolute;
        z-index: 2;
      }

      /* CUSTOM STYLES (mockup: FrontrowMD configures these hex values on their end) */
      .background, .ribbon-body { background: #32457A; }
      .ribbon-tails svg path { stroke: transparent; fill: #32457A; }
      img { border: 2px #32457A solid; }
      .heading svg path { stroke: transparent; fill: #FFFFFF; }
      p, .heading > p, .testimonial-cta > p { color: #FFFFFF; }
      .learn-more, .testimonial-cta > p { text-decoration-color: #FFFFFF; }
    </style>
    <script>
      function getSafeUrl() {
        try {
          return window?.parent?.location?.href || window?.location?.href || '';
        } catch (e) {
          return '';
        }
      }

      function frTrack(event, opts = {}) {
        try {
          window.parent.postMessage({
            name: 'TRACK_FMD_EVENT',
            widgetId: 5943,
            eventName: event,
            properties: {
              ...opts,
              showTestimonialCta: false,
              testimonialCtaOpensModal: false,
              healthBrandProductId: 3845,
              bundleId: null,
              presentationType: 'sticker',
              url: getSafeUrl(),
              widget_version: '2',
              is_sticky: false
            }
          }, '*');
        } catch (e) {}
      }

      function scrollToTestimonials(e) {
        try {
          e.stopPropagation();
          window.parent.postMessage("SCROLL_TO_TESTIMONIALS", "*");
        } catch (e) {
          console.error('Error scrolling to testimonials:', e);
        }
      }

      function clickShowAll(e) {
        try {
          e.stopPropagation();
          window.parent.postMessage({name: "OPEN_TESTIMONIALS_MODAL", source: "widget_click_read_why_they_did"}, "*");
        } catch (e) {
          console.error('Error showing all:', e);
        }
      }

      function openFrontrowModal(){
        try {
          window.parent.postMessage("OPEN_MODAL_STICKER", "*");
        } catch (e) {
          console.error('Error opening modal:', e);
        }
      }

      function toggle() {
        if (document.body.dataset.state === "max") {
          document.getElementById("maximized").style.opacity = "0";
          document.getElementById("maximized").style.width = "0";
          document.getElementById("minimized").style.display = "flex";

          window.parent.postMessage("TOGGLE_STICKER", "*");
          setTimeout(() => {
            document.body.dataset.state = "min";
            document.getElementById("maximized").style.display = "none";
          }, CONFIG.TOGGLE_DELAY);
        } else {
          document.getElementById("minimized").style.display = "none";
          document.getElementById("maximized").style.display = "flex";
          document.getElementById("maximized").style.removeProperty("width");
          document.getElementById("maximized").style.opacity = "1";

          window.parent.postMessage("TOGGLE_STICKER", "*");
          setTimeout(() => {
            document.body.dataset.state = "max";
          }, CONFIG.TOGGLE_DELAY);
        }
      }

      const CONFIG = {
        MAX_RETRIES: 3,
        TOGGLE_DELAY: 300, // ms
        RETRY_DELAY: 500 // ms
      };

      const state = {
        isUpdating: false,
        retryCount: 0,
        isInitialized: false
      };

      function handleOnLoad() {
        if (state.isInitialized) {
          return;
        }

        window.parent.postMessage({ name: "STICKER_REQUEST_READY_STATUS" }, "*");

        window.addEventListener("message", function initListener(event) {
          if (event.data?.name === "PARENT_READY") {
            window.removeEventListener("message", initListener);
            if (state.isUpdating) {
              return;
            }
            state.isUpdating = true;

            document.fonts.ready.then(() => {
              window.parent.postMessage({ name: "RESIZE_STICKER" }, "*");
              state.isInitialized = true;

              setTimeout(() => {
                state.isUpdating = false;
              }, CONFIG.UPDATE_DELAY);
            }).catch((error) => {
              handleOnLoad();
            });
          }
        });

        setTimeout(() => {
          if (!state.isInitialized && state.retryCount < CONFIG.MAX_RETRIES) {
            state.retryCount++;
            handleOnLoad();
          }
        }, CONFIG.RETRY_DELAY);
      }

      window.addEventListener("message", ev => {
        if (ev.data?.name === "STICKER_RESIZED") {
          document.body.style.display = "flex";
        }
      });
    </script>
